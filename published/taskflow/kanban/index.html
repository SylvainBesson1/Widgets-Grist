        async function loadAllData() {
            try {
                const _raw = await grist.docApi.fetchTable('Tasks');
                TASK_COLS = new Set(Object.keys(_raw || {}));
                tasks = convertGristToRecords(_raw);
            } catch (e) {
                tasks = [];
            }

            try {
                team = convertGristToRecords(await grist.docApi.fetchTable('Team'));
            } catch (e) {
                team = [];
            }

            try {
                projects = convertGristToRecords(await grist.docApi.fetchTable('Projects'));
            } catch (e) {
                projects = [];
            }

            gristReady = true;
            rebuildChildrenCache();

            try {
                // Charger la config des statuts depuis la colonne mappée
                const statusCol = columnMapping.status || 'statut';
                const distinctStatuses = [...new Set(tasks.map(t => t?.[statusCol]).filter(Boolean))];
                statusCfg = await TF.loadStatusConfig(grist, 'Tasks', statusCol, distinctStatuses);
            } catch (e) {
                statusCfg = TF.buildStatusConfig(TF.DEFAULT_STATUSES, 'default');
            }

            updateFilterMenus();
            render();
        }

        // Charger le mapping depuis grist.options
        function loadColumnMapping() {
            if (grist && grist.options) {
                const options = grist.options;
                if (options.columnMapping) {
                    columnMapping = { ...columnMapping, ...options.columnMapping };
                }
                // Charger les noms des colonnes pour Team et Projects
                if (options.teamNameColumn) columnMapping.memberName = options.teamNameColumn;
                if (options.teamColorColumn) columnMapping.memberColor = options.teamColorColumn;
                if (options.projectNameColumn) columnMapping.projectName = options.projectNameColumn;
                if (options.projectColorColumn) columnMapping.projectColor = options.projectColorColumn;
                if (options.projectResponsableColumn) columnMapping.projectResponsable = options.projectResponsableColumn;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // FILTRES
        // ═══════════════════════════════════════════════════════════════════════
        function setGroupBy(g) {
            groupBy = g;
            document.querySelectorAll('.group-selector .btn').forEach(b => b.classList.remove('active'));
            document.getElementById('group' + g.charAt(0).toUpperCase() + g.slice(1)).classList.add('active');
            render();
        }

        function changeColorMode(mode) {
            colorMode = mode;
            localStorage.setItem('taskflow_kanban_colormode', mode);
            render();
        }

        function toggleFilterMenu(type) {
            document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open'));
            document.getElementById(`filter${type.charAt(0).toUpperCase() + type.slice(1)}Menu`).classList.toggle('open');
        }

        function fStatusLabel(v) {
            const sc = statusCfg.byValue[v];
            return sc ? sc.label : v;
        }

        function updateFilterMenus() {
            const grp = (label, html, first) => '<div class="fm-group-label'+(first?' first':'')+'">'+label+'</div>'+html;

            // Projets
            const projHtml = projects.length ?
                projects.map(p => {
                    const name = p[columnMapping.projectName] || p.nom || 'Projet sans nom';
                    const color = p[columnMapping.projectColor] || p.couleur || '#64748b';
                    return `<div class="filter-option" onclick="toggleFilterValue('project', ${p.id})">
                        <input type="checkbox" ${filters.project.includes(p.id)?'checked':''}>
                        <span style="color:${color}">●</span> ${escapeHtml(name)}
                    </div>`;
                }).join('') :
                '<div class="filter-option muted">Aucun projet</div>';

            // Priorités
            const prioHtml = [1,2,3,4].map(p =>
                `<div class="filter-option" onclick="toggleFilterValue('priority', ${p})">
                    <input type="checkbox" ${filters.priority.includes(p)?'checked':''}>
                    <span style="color:${PRIORITY_COLORS[p]}">●</span> ${PRIORITY_LABELS[p]}
                </div>`
            ).join('');

            // Assignés
            const team2 = team.filter(m => m.actif !== false);
            const assHtml = team2.length ?
                team2.map(m => {
                    const name = m[columnMapping.memberName] || m.nom || 'Membre sans nom';
                    return `<div class="filter-option" onclick="toggleFilterValue('assignee', ${m.id})">
                        <input type="checkbox" ${filters.assignee.includes(m.id)?'checked':''}>
                        ${escapeHtml(name)}
                    </div>`;
                }).join('') :
                '<div class="filter-option muted">Aucun membre</div>';

            // Statuts
            const statHtml = statusCfg.list.map(sc =>
                `<div class="filter-option" data-status="${escapeHtml(sc.value)}" onclick="toggleFilterValue('status', this.dataset.status)">
                    <input type="checkbox" ${filters.status.includes(sc.value)?'checked':''}>
                    <span style="color:${sc.fillColor}">●</span> ${escapeHtml(sc.label)}
                </div>`
            ).join('');

            const total = filters.project.length + filters.priority.length + filters.assignee.length + filters.status.length;
            const menu = document.getElementById('filterAllMenu');
            if (menu) menu.innerHTML = grp('Projets', projHtml, true) + grp('Priorités', prioHtml) + grp('Assignés', assHtml) + grp('Statuts', statHtml) +
                (total ? '<div class="fm-foot"><span class="fm-clear" onclick="clearAllFilters()">Tout effacer</span></div>' : '');

            const cnt = document.getElementById('filterCount');
            if (cnt) {
                cnt.textContent = total;
                cnt.style.display = total ? 'inline-flex' : 'none';
            }

            const fbtn = document.getElementById('filterBtn');
            if (fbtn) fbtn.classList.toggle('has-filter', total > 0);

            const ms = document.getElementById('moreSubsToggle');
            if (ms) ms.classList.toggle('on', showSubtasks);

            renderFilterChips();
        }

        function renderFilterChips() {
            const bar = document.getElementById('filterChips');
            if (!bar) return;

            const X = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

            const chip = (type, val, label, color) => {
                const dot = color ? `<span class="fc-dot" style="background:${color}"></span>` : '';
                const v = (typeof val === 'number') ? val : JSON.stringify(val);
                return `<span class="fc-chip">${dot}${label}<span class="fc-x" title="Retirer" onclick="removeFilterChip('${type}', ${v})">${X}</span></span>`;
            };

            const chips = [];
            filters.project.forEach(id => {
                const p = projects.find(x => x.id === id);
                const name = p ? (p[columnMapping.projectName] || p.nom || 'Projet') : 'Projet';
                const color = p ? (p[columnMapping.projectColor] || p.couleur || '#64748b') : '#64748b';
                chips.push(chip('project', id, escapeHtml(name), color));
            });

            filters.priority.forEach(v => chips.push(chip('priority', v, PRIORITY_LABELS[v], PRIORITY_COLORS[v])));

            filters.assignee.forEach(id => {
                const m = team.find(x => x.id === id);
                const name = m ? (m[columnMapping.memberName] || m.nom || 'Membre') : 'Membre';
                chips.push(chip('assignee', id, escapeHtml(name)));
            });

            filters.status.forEach(v => {
                const sc = statusCfg.byValue[v];
                chips.push(chip('status', v, sc ? escapeHtml(sc.label) : v, sc ? sc.fillColor : '#94a3b8'));
            });

            if (searchQuery) chips.push(`<span class="fc-chip">« ${escapeHtml(searchQuery)} »<span class="fc-x" title="Effacer la recherche" onclick="clearSearchChip()">${X}</span></span>`);

            if (!chips.length) {
                bar.style.display = 'none';
                bar.innerHTML = '';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML = '<span class="fc-label">Filtres actifs</span>' + chips.join('') + '<span class="fc-clear-all" onclick="clearAllFilters()">Tout effacer</span>';
        }

        function removeFilterChip(type, val) {
            toggleFilterValue(type, val);
        }

        function clearSearchChip() {
            searchQuery = '';
            const si = document.getElementById('searchInput');
            if (si) si.value = '';
            updateFilterMenus();
            render();
        }

        function toggleFilterValue(type, val) {
            const arr = filters[type];
            const idx = arr.indexOf(val);
            if (idx === -1) arr.push(val);
            else arr.splice(idx, 1);
            updateFilterMenus();
            broadcastFilters();
            render();
        }

        function handleSearch(q) {
            searchQuery = q.toLowerCase();
            render();
        }

        function clearAllFilters() {
            filters = { project: [], priority: [], assignee: [], status: [] };
            searchQuery = '';
            const si = document.getElementById('searchInput');
            if (si) si.value = '';
            updateFilterMenus();
            broadcastFilters();
            render();
        }

        function getFilteredTasks() {
            return tasks.filter(t => {
                if (!showSubtasks && t[columnMapping.parentTask]) return false;

                if (filters.project.length) {
                    const taskProject = getTaskProject(t);
                    if (!filters.project.includes(taskProject)) return false;
                }

                if (filters.priority.length && !filters.priority.includes(getTaskPriority(t))) return false;

                if (filters.assignee.length && !getTaskAssignees(t).some(a => filters.assignee.includes(a))) return false;

                if (filters.status.length && !filters.status.includes(getTaskStatus(t))) return false;

                if (searchQuery && !(getTaskTitle(t)||'').toLowerCase().includes(searchQuery)) return false;

                return true;
            });
        }

        function toggleShowSubtasks() {
            showSubtasks = !showSubtasks;
            localStorage.setItem('taskflow_kanban_showsubs', showSubtasks ? '1' : '0');
            const btn = document.getElementById('btnShowSubs');
            if (btn) btn.classList.toggle('active', showSubtasks);
            updateFilterMenus();
            render();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════════════════
        function render() {
            sortableInstances.forEach(s => s.destroy());
            sortableInstances = [];

            const container = document.getElementById('kanbanContainer');
            const ft = getFilteredTasks();
            const columns = buildColumns(ft);

            container.innerHTML = columns.map(col => `
                <div class="kanban-column" data-key="${col.key}">
                    <div class="column-header">
                        <span class="column-title">${col.icon || ''} ${escapeHtml(col.label)} <span class="column-count">${col.tasks.length}</span></span>
                        <button class="column-add" onclick="openCreatePanelForColumn('${col.key}')" title="Ajouter">+</button>
                    </div>
                    <div class="column-body ${col.tasks.length ? '' : 'is-empty'}" id="col-${col.key}">
                        ${col.tasks.length ? col.tasks.map(t => renderCard(t)).join('') : renderEmptyColumn(col)}
                    </div>
                </div>
            `).join('');

            // Initialize Sortable
            columns.forEach(col => {
                const el = document.getElementById(`col-${col.key}`);
                if (el) {
                    sortableInstances.push(new Sortable(el, {
                        group: 'tasks',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        onEnd: (evt) => handleDrop(evt)
                    }));
                }
            });
        }

        function renderEmptyColumn(col) {
            const hasFilters = searchQuery || filters.project.length || filters.priority.length || filters.assignee.length || filters.status.length;
            const inbox = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>';
            const search = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';

            if (hasFilters) {
                return `<div class="tf-empty">
                    <span class="tf-empty-glyph">${search}</span>
                    <div class="tf-empty-title">Aucun résultat</div>
                    <div class="tf-empty-sub">Aucune tâche ne correspond aux filtres dans « ${escapeHtml(col.label)} ».</div>
                    <button class="tf-empty-btn" onclick="clearAllFilters()">Effacer les filtres</button>
                </div>`;
            }

            return `<div class="tf-empty">
                <span class="tf-empty-glyph">${inbox}</span>
                <div class="tf-empty-title">Rien dans « ${escapeHtml(col.label)} »</div>
                <div class="tf-empty-sub">Glissez une tâche ici ou créez-en une nouvelle.</div>
                <button class="tf-empty-btn" onclick="openCreatePanelForColumn('${col.key}')">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg> Nouvelle tâche
                </button>
            </div>`;
        }

        function renderSkeleton() {
            const container = document.getElementById('kanbanContainer');
            if (!container) return;

            const card = '<div class="tf-skel-card"><div class="tf-sk" style="width:70%;height:10px"></div><div style="display:flex;gap:6px;margin-top:11px"><div class="tf-sk" style="width:52px;height:18px;border-radius:9px"></div><div class="tf-sk" style="width:40px;height:18px;border-radius:9px"></div></div><div class="tf-sk" style="width:100%;height:5px;margin-top:12px"></div><div style="display:flex;gap:5px;margin-top:11px"><div class="tf-sk" style="width:24px;height:24px;border-radius:50%"></div><div class="tf-sk" style="width:24px;height:24px;border-radius:50%"></div></div></div>';

            const cols = statusCfg?.list?.slice(0, 4) || [
                { value: 'todo', label: 'À faire' },
                { value: 'inprogress', label: 'En cours' },
                { value: 'review', label: 'En revue' },
                { value: 'done', label: 'Terminé' }
            ];

            container.innerHTML = cols.map((s, i) => `
                <div class="kanban-column">
                    <div class="column-header">
                        <span class="column-title"><span class="tf-sk" style="width:${70 + i*14}px;height:13px"></span></span>
                    </div>
                    <div class="column-body">${card.repeat(i === 1 ? 3 : 2)}</div>
                </div>
            `).join('');
        }

        function buildColumns(ft) {
            if (groupBy === 'statut') {
                return statusCfg.list.map(s => ({
                    key: s.value,
                    label: s.label,
                    icon: '',
                    tasks: ft.filter(t => getTaskStatus(t) === s.value)
                }));
            } else if (groupBy === 'priorite') {
                return [1,2,3,4].map(p => ({
                    key: String(p),
                    label: PRIORITY_LABELS[p],
                    icon: '',
                    tasks: ft.filter(t => getTaskPriority(t) === p)
                }));
            } else if (groupBy === 'projet') {
                const cols = projects.filter(p => p.actif !== false).map(p => ({
                    key: String(p.id),
                    label: p[columnMapping.projectName] || p.nom || 'Projet sans nom',
                    icon: `<span style="color:${p[columnMapping.projectColor] || p.couleur || '#64748b'}">●</span>`,
                    tasks: ft.filter(t => getTaskProject(t) === p.id)
                }));
                cols.push({
                    key: 'none',
                    label: 'Sans projet',
                    icon: '',
                    tasks: ft.filter(t => !getTaskProject(t))
                });
                return cols;
            }
            return [];
        }

        function renderCard(t) {
            const p = getTaskPriority(t);
            const assignees = getTaskAssignees(t);
            const deps = getTaskDependencies(t);
            const projectName = getTaskProject(t) ? getProjectName(getTaskProject(t)) : '';
            const projectColor = getTaskProject(t) ? getProjectColor(getTaskProject(t)) : '#64748b';
            const typeIcon = TYPE_ICONS[getTaskType(t)] || '';
            const subs = getTaskSubtasks(t);
            const subsDone = subs.filter(s => s.done).length;
            const nChildren = getChildren(t.id).length;
            const isChild = !!t[columnMapping.parentTask];

            const barColor = getTaskCardColor(t);
            const prog = getTaskProgress(t);

            let dueHtml = '';
            if (getTaskDueDate(t) && getTaskType(t) !== 'jalon') {
                const _e = gristToDate(getTaskDueDate(t));
                if (_e) {
                    const _t0 = new Date(); _t0.setHours(0,0,0,0);
                    const _d = new Date(_e); _d.setHours(0,0,0,0);
                    const _days = Math.round((_d - _t0) / 86400000);
                    const _done = TF.isTerminal(statusCfg, getTaskStatus(t));
                    const _st = _done ? '' : _days < 0 ? 'over' : _days <= 2 ? 'soon' : '';
                    const _MO = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
                    dueHtml = `<span class="tf-due ${_st}">${_d.getDate()} ${_MO[_d.getMonth()]}</span>`;
                }
            }

            return `<div class="task-card p${p} ${TF.isTerminal(statusCfg, getTaskStatus(t)) ? 'done' : ''} ${t.id === selectedTaskId ? 'selected' : ''}"
                data-id="${t.id}"
                style="border-left-color:${barColor}"
                onclick="openTaskPanel(${t.id})">
                <div class="card-header">
                    <span class="card-title">${isChild ? '↳ ' : ''}${escapeHtml(getTaskTitle(t)) || 'Sans titre'}</span>
                    ${typeIcon ? `<span class="card-type">${typeIcon}</span>` : ''}
                </div>
                <div class="card-meta">
                    <span class="tf-badge tf-p${p}">${PRIORITY_LABELS[p]}</span>
                    ${projectName ? `<span class="card-project"><span style="color:${projectColor}">●</span> ${escapeHtml(projectName)}</span>` : ''}
                    ${deps.length ? `<span class="card-deps">← ${deps.length}</span>` : ''}
                    ${subs.length ? `<span class="card-subs${subsDone === subs.length ? ' complete' : ''}" title="Sous-tâches (checklist)">◎ ${subsDone}/${subs.length}</span>` : ''}
                    ${nChildren ? `<span class="card-subs" title="Sous-tâches (hiérarchie)" onclick="event.stopPropagation();openTaskPanel(${t.id})">↳ ${nChildren}</span>` : ''}
                    ${dueHtml}
                </div>
                ${getTaskType(t) !== 'jalon' ? `
                <div class="card-progress-row">
                    <div class="card-progress" onclick="event.stopPropagation();setCardProgress(event, ${t.id})">
                        <div class="card-progress-fill p${p}" style="width:${prog}%"></div>
                    </div>
                    <span class="card-progress-pct">${prog}%</span>
                </div>` : ''}
                ${assignees.length ? `
                <div class="card-assignees">
                    ${assignees.slice(0, 3).map(id => `
                        <div class="card-avatar" style="background:${getTeamMemberColor(id)}">
                            ${getInitials(getTeamMemberName(id))}
                        </div>
                    `).join('')}
                    ${assignees.length > 3 ? `<div class="card-avatar more">+${assignees.length - 3}</div>` : ''}
                </div>` : ''}
            </div>`;
        }

        async function handleDrop(evt) {
            const taskId = parseInt(evt.item.dataset.id);
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const colKey = (evt.to && evt.to.id) ? evt.to.id.replace(/^col-/, '') : null;
            if (colKey === null) return;

            let updates = {};
            if (groupBy === 'statut') {
                updates[columnMapping.status] = colKey;
                const _wasT = TF.isTerminal(statusCfg, getTaskStatus(task));
                const _nowT = TF.isTerminal(statusCfg, colKey);
                if (_nowT) {
                    updates[columnMapping.progress] = 100;
                    if (!_wasT) updates.dateCloture = Math.floor(Date.now() / 1000);
                } else if (_wasT) {
                    updates.dateCloture = null;
                }
            } else if (groupBy === 'priorite') {
                updates[columnMapping.priority] = parseInt(colKey, 10);
            } else if (groupBy === 'projet') {
                updates[columnMapping.project] = colKey === 'none' ? null : parseInt(colKey, 10);
            }

            Object.assign(task, updates);

            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, pruneTaskRecord(updates)]]);
                    showSaveIndicator();
                } catch (e) {
                    showToast('Erreur déplacement', 'error');
                    await loadAllData();
                }
            }
            render();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PANEL
        // ═══════════════════════════════════════════════════════════════════════
        function openPanel() {
            panelState.open = true;
            document.getElementById('panel').classList.add('open');
            document.getElementById('kanbanContainer').classList.add('panel-open');
            document.getElementById('panelOverlay').classList.add('visible');
        }

        function closePanel() {
            panelState.open = false;
            document.getElementById('panel').classList.remove('open');
            document.getElementById('kanbanContainer').classList.remove('panel-open');
            document.getElementById('panelOverlay').classList.remove('visible');
            panelState = {
                open: false,
                isNew: false,
                taskId: null,
                taskIndex: -1,
                columnTasks: [],
                columnKey: null,
                editData: null
            };
            selectedTaskId = null;
            render();
        }

        function confirmClosePanel() {
            if (panelState.isNew && panelState.editData?.[columnMapping.title]?.trim()) {
                if (confirm('Fermer sans créer la tâche ?')) closePanel();
            } else {
                closePanel();
            }
        }

        function openTaskPanel(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            selectedTaskId = taskId;

            const ft = getFilteredTasks();
            const columns = buildColumns(ft);
            let colKey = null, colTasks = [];

            for (const col of columns) {
                const idx = col.tasks.findIndex(t => t.id === taskId);
                if (idx !== -1) {
                    colKey = col.key;
                    colTasks = col.tasks;
                    break;
                }
            }

            panelState.taskId = taskId;
            panelState.taskIndex = colTasks.findIndex(t => t.id === taskId);
            panelState.columnTasks = colTasks;
            panelState.columnKey = colKey;
            panelState.isNew = false;
            panelState.editData = cloneTaskData(task);

            renderPanelTask();
            openPanel();

            if (gristReady) grist.setSelectedRows([taskId]);
            render();
        }

        function openCreatePanel() {
            openCreatePanelForColumn(groupBy === 'statut' ? statusCfg.firstValue :
                                      groupBy === 'priorite' ? '3' :
                                      projects.length ? String(projects[0].id) : 'none');
        }

        function openCreatePanelForColumn(colKey) {
            const today = new Date();
            let preset = {};

            if (groupBy === 'statut') {
                preset[columnMapping.status] = colKey;
            } else if (groupBy === 'priorite') {
                preset[columnMapping.priority] = colKey;
            } else if (groupBy === 'projet') {
                preset[columnMapping.project] = colKey === 'none' ? null : parseInt(colKey);
            }

            panelState = {
                open: true,
                isNew: true,
                taskId: null,
                taskIndex: -1,
                columnTasks: [],
                columnKey: colKey,
                editData: {
                    [columnMapping.title]: '',
                    [columnMapping.description]: '',
                    [columnMapping.type]: 'tache',
                    [columnMapping.priority]: preset[columnMapping.priority] || '3',
                    [columnMapping.status]: preset[columnMapping.status] || 'todo',
                    [columnMapping.progress]: 0,
                    [columnMapping.startDate]: dateToGrist(today),
                    [columnMapping.endDate]: dateToGrist(addDays(today, 7)),
                    [columnMapping.project]: preset[columnMapping.project] !== undefined ?
                        preset[columnMapping.project] : (projects.length > 0 ? projects[0].id : null),
                    [columnMapping.assignees]: [],
                    [columnMapping.dependencies]: [],
                    [columnMapping.tags]: [],
                    [columnMapping.estimatedHours]: null,
                    [columnMapping.timeSpent]: null,
                    [columnMapping.subtasks]: [],
                    [columnMapping.color]: null,
                    [columnMapping.parentTask]: null,
                    [columnMapping.charges]: []
                }
            };

            renderPanelTask();
            openPanel();
            render();
            setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
        }

        function openCreateTaskWithParent(parentId) {
            const today = new Date();
            const parent = parentId ? tasks.find(t => t.id === parentId) : null;

            panelState = {
                open: true,
                isNew: true,
                taskId: null,
                taskIndex: -1,
                columnTasks: [],
                columnKey: null,
                editData: {
                    [columnMapping.title]: '',
                    [columnMapping.description]: '',
                    [columnMapping.type]: 'tache',
                    [columnMapping.priority]: '3',
                    [columnMapping.status]: 'todo',
                    [columnMapping.progress]: 0,
                    [columnMapping.startDate]: dateToGrist(today),
                    [columnMapping.endDate]: dateToGrist(addDays(today, 7)),
                    [columnMapping.project]: parent?.[columnMapping.project] || (projects.length > 0 ? projects[0].id : null),
                    [columnMapping.assignees]: [],
                    [columnMapping.dependencies]: [],
                    [columnMapping.tags]: [],
                    [columnMapping.estimatedHours]: null,
                    [columnMapping.timeSpent]: null,
                    [columnMapping.subtasks]: [],
                    [columnMapping.color]: null,
                    [columnMapping.parentTask]: parentId || null,
                    [columnMapping.charges]: []
                }
            };

            renderPanelTask();
            openPanel();
            render();
            setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
        }

        function detachFromParent() {
            updateField(columnMapping.parentTask, null);
        }

        function setParent(newParentId) {
            if (panelState.taskId && !canSetParent(panelState.taskId, newParentId)) {
                showToast('Cycle détecté — choix impossible', 'error');
                return;
            }
            updateField(columnMapping.parentTask, newParentId);
        }

        function cloneTaskData(task) {
            const data = {};
            // Copier toutes les valeurs mappées
            Object.keys(columnMapping).forEach(key => {
                const col = columnMapping[key];
                if (col && task[col] !== undefined) {
                    data[key] = task[col];
                }
            });
            // Traiter les RefList
            data.assignees = getTaskAssignees(task);
            data.dependencies = getTaskDependencies(task);
            data.tags = getTaskTags(task);
            data.subtasks = getTaskSubtasks(task);
            data.charges = TF.parseCharges(task[columnMapping.charges]);

            Object.keys(columnMapping).forEach(key => {

                if (col && data[key] !== undefined) {
                    task[col] = data[key];
                }
            });

            // Traiter les RefList
            task[columnMapping.assignees] = ['L', ...data.assignees];
            task[columnMapping.dependencies] = ['L', ...data.dependencies];
            task[columnMapping.tags] = ['L', ...data.tags];
            task[columnMapping.subtasks] = subtasksToJson(data.subtasks);
            task[columnMapping.charges] = TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId)));

            if (newIdx >= panelState.columnTasks.length) newIdx = 0;
            const t = panelState.columnTasks[newIdx];
            if (t) openTaskPanel(t.id);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // FIELD HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function updateField(field, value, noSave = false) {
            const data = panelState.editData;
            if (!data) return;

            // Gérer les dates
            if (field === columnMapping.startDate || field === columnMapping.endDate) {
                value = value ? dateToGrist(parseInputDate(value)) : null;
            }

            // Gérer la date de clôture automatique
            if (field === columnMapping.status) {
                const _wasT = TF.isTerminal(statusCfg, data[columnMapping.status]);
                const _nowT = TF.isTerminal(statusCfg, value);
                if (_nowT && !_wasT) {
                    data.dateCloture = Math.floor(Date.now() / 1000);
                } else if (!_nowT && _wasT) {
                    data.dateCloture = null;
                }
            }

            // Gérer le type jalon
            if (field === columnMapping.type && value === 'jalon' && data[columnMapping.startDate]) {
                data[columnMapping.endDate] = data[columnMapping.startDate];
            }

            data[field] = value;
            syncLocalTask();

            const visualFields = [columnMapping.type, columnMapping.priority, columnMapping.status,
                                  columnMapping.project, columnMapping.progress, columnMapping.color, columnMapping.parentTask];
            if (visualFields.includes(field)) {
                renderPanelTask();
                if (!panelState.isNew) render();
            }

            if (field === columnMapping.title && panelState.isNew) {
                const btn = document.querySelector('.panel-footer .panel-btn.success');
                if (btn) btn.disabled = !value || !value.trim();
            }

            if (!panelState.isNew && !noSave && gristReady) saveTaskToGrist();
        }

        function setProgressPreset(value) {
            const data = panelState.editData;
            if (!data) return;

            data[columnMapping.progress] = value;
            syncLocalTask();

            const slider = document.querySelector('.progress-slider');
            const valueSpan = document.getElementById('progressValue');
            const barFill = document.getElementById('progressBarFill');

            if (slider) slider.value = value;
            if (valueSpan) valueSpan.textContent = value + '%';
            if (barFill) barFill.style.width = value + '%';

            document.querySelectorAll('.progress-preset').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === value);
            });

            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function setTodayDate() {
            const data = panelState.editData;
            if (!data) return;

            const today = dateToGrist(new Date());
            data[columnMapping.startDate] = today;

            if (data[columnMapping.type] === 'jalon') {

            }

            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }

        async function setCardProgress(e, taskId) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.round((clickX / rect.width) * 100);
            const roundedPercent = Math.round(percent / 5) * 5;
            const clampedPercent = Math.max(0, Math.min(100, roundedPercent));

            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            task[columnMapping.progress] = clampedPercent;
            if (task[columnMapping.progress] === 100 && !TF.isTerminal(statusCfg, getTaskStatus(task))) {
                task[columnMapping.status] = statusCfg.terminalValue;
            }

            if (gristReady) {
                try {
                    await grist.docApi.applyUserActions([[
                        'UpdateRecord', 'Tasks', taskId,
                        pruneTaskRecord({
                            [columnMapping.progress]: clampedPercent,
                            [columnMapping.status]: task[columnMapping.status]
                        })
                    ]]);
                    showToast(`${clampedPercent}%`, 'success');
                } catch (err) {
                    showToast('Erreur', 'error');
                }
            }
            render();
        }

        function handleTagKeydown(e) {
            const data = panelState.editData;
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const tag = e.target.value.trim().replace(/^#/, '');
                if (tag && !data.tags.includes(tag)) {
                    data.tags.push(tag);
                    e.target.value = '';
                    syncLocalTask();
                    if (!panelState.isNew && gristReady) saveTaskToGrist();
                    renderPanelTask();

            } else if (e.key === 'Backspace' && !e.target.value && data.tags.length) {
                data.tags.pop();
                syncLocalTask();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();

        function addSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;

            const data = panelState.editData;
            if (!data.subtasks) data.subtasks = [];

            data.subtasks.push({ id: Date.now(), text: text, done: false });
            input.value = '';
            updateSubtaskProgress();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanelTask();
            render();
        }

        function toggleSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;

            const st = data.subtasks.find(s => s.id === id);
            if (st) {
                st.done = !st.done;
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();
            }
        }

        function removeSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;

            const idx = data.subtasks.findIndex(s => s.id === id);
            if (idx !== -1) {
                data.subtasks.splice(idx, 1);
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanelTask();
                render();
            }
        }

        function editSubtask(id, value) {
            const data = panelState.editData;
            if (!data || !data.subtasks) return;

            const st = data.subtasks.find(s => s.id === id);
            if (!st) return;

            const t = (value || '').trim();
            if (!t || t === st.text) return;

            st.text = t;
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function updateSubtaskProgress() {
            const data = panelState.editData;
            if (!data.subtasks || data.subtasks.length === 0) return;

            const done = data.subtasks.filter(s => s.done).length;
            const total = data.subtasks.length;
            data[columnMapping.progress] = Math.round((done / total) * 100);
            syncLocalTask();
        }

        function handleSubtaskKeydown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSubtask();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // CRUD
        // ═══════════════════════════════════════════════════════════════════════
        async function saveTaskToGrist() {
            const data = panelState.editData;
            if (!data || panelState.isNew || !gristReady) return;

            if (data[columnMapping.startDate] && data[columnMapping.endDate] &&
                data[columnMapping.startDate] > data[columnMapping.endDate]) {
                showToast('La date de début ne peut pas dépasser la date de fin', 'error');
                return;
            }

            syncLocalTask();

            const record = {};
            // Copier toutes les valeurs mappées
            Object.keys(columnMapping).forEach(key => {
                const col = columnMapping[key];
                if (col && data[key] !== undefined) {
                    record[col] = data[key];
                }
            });

            // Traiter les RefList
            record[columnMapping.assignees] = ['L', ...data.assignees];
            record[columnMapping.dependencies] = ['L', ...data.dependencies];
            record[columnMapping.tags] = ['L', ...data.tags];
            record[columnMapping.subtasks] = subtasksToJson(data.subtasks);
            record[columnMapping.charges] = TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId)));

            try {
                await grist.docApi.applyUserActions([[
                    'UpdateRecord', 'Tasks', panelState.taskId, pruneTaskRecord(record)
                ]]);
                showSaveIndicator();
            } catch (e) {
                showToast('Erreur sauvegarde', 'error');
            }
        }

            const data = panelState.editData;
            if (!data || !data[columnMapping.title]?.trim()) {

                return;

            if (data[columnMapping.startDate] && data[columnMapping.endDate] &&
                data[columnMapping.startDate] > data[columnMapping.endDate]) {
                showToast('La date de début ne peut pas dépasser la date de fin', 'error');
                return;
            }

            const record = {};
            // Copier toutes les valeurs mappées
            Object.keys(columnMapping).forEach(key => {
                const col = columnMapping[key];
                if (col && data[key] !== undefined) {
                    record[col] = data[key];
                }
            });

            // Traiter les RefList
            record[columnMapping.assignees] = ['L', ...data.assignees];
            record[columnMapping.dependencies] = ['L', ...data.dependencies];
            record[columnMapping.tags] = ['L', ...data.tags];
            record[columnMapping.subtasks] = subtasksToJson(data.subtasks);
            record[columnMapping.charges] = TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId)));

            if (gristReady) {
                try {

        // ═══════════════════════════════════════════════════════════════════════
        // AGGREGATION
        // ═══════════════════════════════════════════════════════════════════════
        function aggregateProgress(t, visited = new Set()) {
            if (visited.has(t.id)) return getTaskProgress(t) || 0;
            visited.add(t.id);
            const kids = getChildren(t.id);
            if (!kids.length) return getTaskProgress(t) || 0;

            const allWeighted = kids.every(k => k[columnMapping.estimatedHours] && k[columnMapping.estimatedHours] > 0);
            if (allWeighted) {
                const totalW = kids.reduce((s, k) => s + (k[columnMapping.estimatedHours] || 0), 0);
                return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited) * (k[columnMapping.estimatedHours] || 0), 0) / totalW);
            }
            return Math.round(kids.reduce((s, k) => s + aggregateProgress(k, visited), 0) / kids.length);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════
        async function initGrist() {
            try {
                await grist.ready({ requiredAccess: 'full' });
            } catch (e) {
                console.log('Grist unavailable, using demo:', e);
                useDemoMode();
                return;
            }

            try {
                await ensureSchema();
            } catch (e) {
                console.error('ensureSchema error (continuing):', e);
                showToast('Schéma: ' + (e?.message || e), 'error');
            }

            try {
                await loadAllData();
            } catch (e) {
                console.error('loadAllData error (continuing):', e);
                showToast('Chargement: ' + (e?.message || e), 'error');
            }

            try {
                grist.onRecords(async () => await loadAllData());
                grist.onRecord((rec) => {
                    if (rec?.id && rec.id !== selectedTaskId) {
                        selectedTaskId = rec.id;
                        render();
                    }
                });
                grist.onOptions((options, interaction) => {
                    if (options?.filters && interaction?.source !== 'self') {
                        const f = options.filters;
                        filters.project = Array.isArray(f.project) ? f.project : [];
                        filters.priority = Array.isArray(f.priority) ? f.priority : [];
                        filters.assignee = Array.isArray(f.assignee) ? f.assignee : [];
                        filters.status = Array.isArray(f.status) ? f.status : [];
                        updateFilterMenus();
                        render();
                    }
                    // Charger le mapping si les options changent
                    if (options?.columnMapping) {
                        loadColumnMapping();
                        render();
                    }
                });

                const s = document.getElementById('colorSelect');
                if (s) s.value = colorMode;
            } catch (e) {
                console.error('Grist listeners error:', e);
            }
        }

    <!-- Module TF (TaskFlow Core) -->
    <script>
        const TF = (function () {
            'use strict';

            const DEFAULT_STATUSES = [
                { value: 'todo',       label: 'À faire',  fillColor: '#94a3b8', textColor: '#ffffff' },
                { value: 'inprogress', label: 'En cours', fillColor: '#f59e0b', textColor: '#ffffff' },
                { value: 'review',     label: 'En revue', fillColor: '#3b82f6', textColor: '#ffffff' },
                { value: 'done',       label: 'Terminé',  fillColor: '#10b981', textColor: '#ffffff' }
            ];
            const DEFAULTS_BY_VALUE = {};
            for (var _i = 0; _i < DEFAULT_STATUSES.length; _i++) {
                DEFAULTS_BY_VALUE[DEFAULT_STATUSES[_i].value] = DEFAULT_STATUSES[_i];
            }

            function columnarToRows(data) {
                if (!data || Array.isArray(data)) return data || [];
                const cols = Object.keys(data);
                if (!cols.length) return [];
                const n = (data[cols[0]] && data[cols[0]].length) || 0;
                const rows = [];
                for (let i = 0; i < n; i++) {
                    const rec = {};
                    for (const k of cols) rec[k] = data[k][i];
                    rows.push(rec);
                }
                return rows;
            }

            async function tableRowId(grist, tableId) {
                const meta = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                const row = meta.find(r => r.tableId === tableId);
                return row ? row.id : null;
            }

            function buildStatusConfig(list, source) {
                const clean = (list || []).filter(s => s && s.value != null).map(s => {
                    const v = String(s.value);
                    const d = DEFAULTS_BY_VALUE[v];
                    const hasExplicitLabel = s.label != null && s.label !== '' && String(s.label) !== v;
                    return {
                        value: v,
                        label: hasExplicitLabel ? String(s.label) : (d ? d.label : v),
                        fillColor: s.fillColor || (d ? d.fillColor : '#94a3b8'),
                        textColor: s.textColor || (d ? d.textColor : '#ffffff')
                    };
                });
                const final = clean.length ? clean : DEFAULT_STATUSES.slice();
                const byValue = {};
                for (const s of final) byValue[s.value] = s;
                return {
                    list: final,
                    byValue,
                    values: final.map(s => s.value),
                    terminalValue: final[final.length - 1].value,
                    firstValue: final[0].value,
                    source: clean.length ? source : 'default'
                };
            }

            async function loadStatusConfig(grist, table, column, distinctFallback) {
                try {
                    const tid = await tableRowId(grist, table);
                    if (tid != null) {
                        const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                        const col = cols.find(c => c.parentId === tid && c.colId === column);
                        if (col && col.widgetOptions) {
                            let opt = {};
                            try { opt = JSON.parse(col.widgetOptions) || {}; } catch (e) { opt = {}; }
                            const choices = Array.isArray(opt.choices) ? opt.choices : [];
                            const co = opt.choiceOptions || {};
                            if (choices.length) {
                                return buildStatusConfig(choices.map(ch => ({
                                    value: ch,
                                    label: ch,
                                    fillColor: co[ch] && co[ch].fillColor,
                                    textColor: co[ch] && co[ch].textColor
                                })), 'choice');
                            }
                        }
                    }
                } catch (e) { }

                if (Array.isArray(distinctFallback) && distinctFallback.length) {
                    const seen = [];
                    for (const v of distinctFallback) {
                        if (v != null && v !== '' && seen.indexOf(v) === -1) seen.push(v);
                    }
                    if (seen.length) return buildStatusConfig(seen.map(v => ({ value: v, label: v })), 'data');
                }
                return buildStatusConfig(DEFAULT_STATUSES.slice(), 'default');
            }

            function getStatus(cfg, value) {
                if (cfg && cfg.byValue && cfg.byValue[value]) return cfg.byValue[value];
                return { value: value, label: value || '', fillColor: '#94a3b8', textColor: '#ffffff' };
            }

            function isTerminal(cfg, value) {
                return !!cfg && value === cfg.terminalValue;
            }

            async function seedStatusChoices(grist, table, column, statuses) {
                try {
                    const tid = await tableRowId(grist, table);
                    if (tid == null) return;
                    const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const col = cols.find(c => c.parentId === tid && c.colId === column);
                    if (!col) return;
                    let opt = {};
                    try { opt = JSON.parse(col.widgetOptions || '{}') || {}; } catch (e) { opt = {}; }
                    if (Array.isArray(opt.choices) && opt.choices.length) return;
                    const list = statuses && statuses.length ? statuses : DEFAULT_STATUSES;
                    const choiceOptions = {};
                    for (const s of list) choiceOptions[s.value] = { fillColor: s.fillColor, textColor: s.textColor };
                    const widgetOptions = JSON.stringify({ choices: list.map(s => s.value), choiceOptions: choiceOptions });
                    await grist.docApi.applyUserActions([['ModifyColumn', table, column, { widgetOptions: widgetOptions }]]);
                } catch (e) { console.warn('TF.seedStatusChoices:', e && e.message); }
            }

            async function setRefDisplayColumns(grist, specs) {
                if (!Array.isArray(specs) || !specs.length) return;
                try {
                    const tables = columnarToRows(await grist.docApi.fetchTable('_grist_Tables'));
                    const cols = columnarToRows(await grist.docApi.fetchTable('_grist_Tables_column'));
                    const tidOf = (tableId) => { const r = tables.find(t => t.tableId === tableId); return r ? r.id : null; };
                    const colOf = (tableRow, colId) => cols.find(c => c.parentId === tableRow && c.colId === colId);

                    const actions = [];
                    for (const s of specs) {
                        const srcTid = tidOf(s.table);
                        if (srcTid == null) continue;
                        const refCol = colOf(srcTid, s.column);
                        if (!refCol) continue;
                        const m = /^(?:Ref|RefList):(.+)$/.exec(refCol.type || '');
                        if (!m) continue;
                        const targetTid = tidOf(m[1]);
                        if (targetTid == null) continue;
                        const visCol = colOf(targetTid, s.visibleColId);
                        if (!visCol) continue;
                        if (refCol.visibleCol === visCol.id) continue;
                        actions.push(['SetDisplayFormula', s.table, null, refCol.id, '$' + s.column + '.' + s.visibleColId]);
                        actions.push(['UpdateRecord', '_grist_Tables_column', refCol.id, { visibleCol: visCol.id }]);
                    }
                    if (actions.length) await grist.docApi.applyUserActions(actions);
                } catch (e) { console.warn('TF.setRefDisplayColumns:', e && e.message); }
            }

            function parseCharges(v) {
                try {
                    const a = JSON.parse(v || '[]');
                    if (!Array.isArray(a)) return [];
                    return a.filter(x => x && x.teamId != null)
                            .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                            .filter(x => !isNaN(x.teamId));
                } catch (e) { return []; }
            }

            function chargesToJson(arr) {
                return JSON.stringify((arr || [])
                    .filter(x => x && x.teamId != null)
                    .map(x => ({ teamId: Number(x.teamId), heures: Number(x.heures) || 0 }))
                    .filter(x => !isNaN(x.teamId)));
            }

            function chargeTotal(charges) {
                return parseCharges(typeof charges === 'string' ? charges : JSON.stringify(charges || [])).reduce((s, c) => s + c.heures, 0);
            }

            function chargeByMember(tasks) {
                const by = {};
                for (const t of (tasks || [])) {
                    for (const c of parseCharges(t && t.charges)) {
                        by[c.teamId] = (by[c.teamId] || 0) + c.heures;
                    }
                }
                return by;
            }

            function periodKey(date, granularity) {
                if (granularity === 'month') {
                    return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
                }
                const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
                const day = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - day);
                const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
            }

            function chargeByMemberPeriod(tasks, granularity) {
                const g = granularity === 'month' ? 'month' : 'week';
                const out = {};
                for (const t of (tasks || [])) {
                    const charges = parseCharges(t && t.charges);
                    if (!charges.length) continue;
                    const s = t.dateDebut, e = t.dateEcheance;
                    if (s == null || e == null) continue;
                    const day0 = Math.floor((s * 1000) / 86400000);
                    const day1 = Math.floor((e * 1000) / 86400000);
                    const nDays = Math.max(day1 - day0 + 1, 1);
                    for (const c of charges) {
                        const perDay = (Number(c.heures) || 0) / nDays;
                        if (!perDay) continue;
                        if (!out[c.teamId]) out[c.teamId] = {};
                        for (let dd = day0; dd <= day1; dd++) {
                            const key = periodKey(new Date(dd * 86400000), g);
                            out[c.teamId][key] = (out[c.teamId][key] || 0) + perDay;
                        }
                    }
                }
                return out;
            }

            return {
                DEFAULT_STATUSES: DEFAULT_STATUSES,
                columnarToRows: columnarToRows,
                loadStatusConfig: loadStatusConfig,
                buildStatusConfig: buildStatusConfig,
                getStatus: getStatus,
                isTerminal: isTerminal,
                seedStatusChoices: seedStatusChoices,
                setRefDisplayColumns: setRefDisplayColumns,
                parseCharges: parseCharges,
                chargesToJson: chargesToJson,
                chargeTotal: chargeTotal,
                chargeByMember: chargeByMember,
                periodKey: periodKey,
                chargeByMemberPeriod: chargeByMemberPeriod
            };
        })();
    </script>
